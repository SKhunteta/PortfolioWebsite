<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="You Are Here">
<title>You Are Here — The Happiness Liability</title>
<style>
/* ------------------------------------------------------------------
   "You Are Here" — Tezcon 2026 kiosk. Fully offline, single file.
   Dark-room legible. No external resources of any kind.
------------------------------------------------------------------- */
:root{
  --ink:#e8e6e0;
  --ink-dim:#9a978f;
  --ink-faint:#6a6862;
  --teal:#5fa39a;
  --warm:#b3a389;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
  background:#101312;
  color:var(--ink);
  font-family:var(--serif);
  -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
body{transition:background-color .8s ease}

/* ---- stage + track ---- */
#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  /* pan-y lets the browser scroll a too-tall panel natively;
     horizontal swipes stay ours via the pointer handlers. */
  touch-action:pan-y;
  cursor:default;
}
#track{
  display:flex;
  height:100%;
  will-change:transform;
  transition:transform .3s ease;
}
#track.dragging{transition:none}
#track.rewind{transition:transform .9s cubic-bezier(.4,0,.2,1)}

/* ---- panel layout ---- */
.panel{
  flex:0 0 100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  /* auto margins on .year/.content (not justify-content:center) so a
     panel taller than a phone screen top-aligns and scrolls instead
     of clipping both ends. */
  justify-content:flex-start;
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior-y:contain;
  -webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top, 0px) + 4vh)
          calc(env(safe-area-inset-right, 0px) + 7vw)
          calc(env(safe-area-inset-bottom, 0px) + 12vh)
          calc(env(safe-area-inset-left, 0px) + 7vw);
  text-align:center;
}
.panel .year{
  margin-top:auto;
  font-family:var(--sans);
  font-weight:200;
  font-variant-numeric:tabular-nums;
  font-size:clamp(44px, 11vh, 104px);
  letter-spacing:.04em;
  line-height:1;
  min-height:14vh;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  color:var(--ink-dim);
  margin-bottom:4.5vh;
}
.panel .content{
  max-width:640px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2.6vh;
  margin-bottom:auto;
}
.panel .kicker{
  font-family:var(--sans);
  font-size:clamp(11px, 1.3vh, 14px);
  font-weight:500;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--accent, var(--ink-faint));
}
.panel .title{
  font-family:var(--serif);
  font-weight:400;
  font-size:clamp(34px, 5.2vh, 52px);
  line-height:1.15;
  letter-spacing:-.01em;
  text-wrap:balance;
}
.panel .body{
  font-size:clamp(20px, 2.4vh, 24px);
  line-height:1.6;
  max-width:34ch;
  color:var(--ink);
}
.panel .body em{font-style:italic}
.panel .footnote{
  font-family:var(--sans);
  font-size:clamp(13px, 1.5vh, 16px);
  line-height:1.5;
  color:var(--ink-faint);
  max-width:44ch;
}
.panel .closing{
  font-family:var(--serif);
  font-style:italic;
  font-size:clamp(26px, 3.6vh, 36px);
  line-height:1.3;
  color:var(--teal);
  margin-top:1.5vh;
}
.motif{min-height:0}

/* ---- era accents (background is set per-panel on <body> via JS) ---- */
.panel[data-era="warm"]{--accent:var(--warm)}
.panel[data-era="cold"]{--accent:#8b95a1}
.panel[data-era="grey"]{--accent:#94938c}
.panel[data-era="teal"]{--accent:var(--teal)}

/* ---- entry animation (title fades up, body follows) ---- */
.fx .title,.fx .kicker,.fx .body,.fx .footnote,.fx .closing,.fx .motif{
  opacity:0;
  transform:translateY(10px);
}
.fx.active .kicker{transition:opacity .2s ease .05s, transform .2s ease .05s}
.fx.active .title{transition:opacity .2s ease .1s, transform .2s ease .1s}
.fx.active .body{transition:opacity .25s ease .2s, transform .25s ease .2s}
.fx.active .motif{transition:opacity .4s ease .35s, transform .4s ease .35s}
.fx.active .footnote{transition:opacity .3s ease .45s, transform .3s ease .45s}
.fx.active .closing{transition:opacity .6s ease .8s, transform .6s ease .8s}
.fx.active .kicker,.fx.active .title,.fx.active .body,
.fx.active .footnote,.fx.active .closing,.fx.active .motif{
  opacity:1;
  transform:none;
}
/* P4 gets no animation at all: stillness is the design. */
.static-panel .kicker,.static-panel .title,.static-panel .body,
.static-panel .footnote,.static-panel .closing,.static-panel .motif{
  opacity:1 !important;
  transform:none !important;
  transition:none !important;
  animation:none !important;
}

/* ---- progress: scrubber + dots ---- */
#progress{
  position:fixed;
  left:0;
  right:0;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 2.2vh);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1.4vh;
  pointer-events:none;
}
#scrubber{
  display:flex;
  align-items:center;
  gap:12px;
  width:min(60vw, 480px);
  font-family:var(--sans);
  font-size:11px;
  letter-spacing:.15em;
  color:var(--ink-faint);
}
#scrubber .rail{
  flex:1;
  height:2px;
  background:#2c2f2d;
  border-radius:1px;
  overflow:hidden;
}
#scrubber .fill{
  height:100%;
  width:0%;
  background:var(--teal);
  transition:width .3s ease;
}
#dots{
  display:flex;
  gap:2px;
  pointer-events:auto;
}
#dots button{
  appearance:none;
  border:none;
  background:transparent;
  width:22px;
  height:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
#dots button::after{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:#3a3d3b;
  transition:background .25s ease, transform .25s ease;
}
#dots button.on::after{
  background:var(--ink);
  transform:scale(1.35);
}

/* ---- P0 attract motifs ---- */
.pin-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.pin-svg .pulse{
  transform-origin:20px 34px;
  animation:pinpulse 2.8s ease-in-out infinite;
}
@keyframes pinpulse{
  0%,100%{opacity:.25;transform:scale(1)}
  50%{opacity:.7;transform:scale(1.5)}
}
.swipe-hint{
  font-family:var(--sans);
  font-size:13px;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--ink-faint);
  animation:hintpulse 3.2s ease-in-out infinite;
}
@keyframes hintpulse{
  0%,100%{opacity:.35;transform:translateX(0)}
  50%{opacity:.9;transform:translateX(6px)}
}

/* ---- P2 empty frame ---- */
.frame-svg rect.border{
  stroke-dasharray:720;
  stroke-dashoffset:720;
}
.active .frame-svg rect.border{
  animation:drawframe 1.6s ease .4s forwards;
}
@keyframes drawframe{to{stroke-dashoffset:0}}

/* ---- P4 count: static, small, restrained ---- */
.count{
  font-family:var(--sans);
  font-variant-numeric:tabular-nums;
  font-size:15px;
  letter-spacing:.3em;
  color:var(--ink-faint);
}

/* ---- P6 self-redacting lines ---- */
.redact{display:flex;flex-direction:column;gap:9px;width:min(300px,60vw)}
.redact .line{
  position:relative;
  height:10px;
  border-radius:2px;
  background:#3b3e3c;
  overflow:hidden;
}
.redact .line i{
  position:absolute;
  inset:0;
  width:0%;
  background:#000;
  border-radius:2px;
}
.active .redact .line i{animation:redactline .9s ease forwards}
.active .redact .line:nth-child(1) i{animation-delay:.6s}
.active .redact .line:nth-child(2) i{animation-delay:1.0s}
.active .redact .line:nth-child(3) i{animation-delay:1.4s}
.active .redact .line:nth-child(4) i{animation-delay:1.8s}
.active .redact .line:nth-child(5) i{animation-delay:2.2s}
@keyframes redactline{to{width:100%}}

/* ---- P8 contract header ---- */
.contract{
  font-family:var(--mono);
  border:1px solid #3c4341;
  border-radius:4px;
  padding:14px 26px;
  display:flex;
  flex-direction:column;
  gap:5px;
  background:rgba(0,0,0,.25);
}
.contract .co{
  font-size:10px;
  letter-spacing:.3em;
  color:var(--ink-faint);
}
.contract .id{
  font-size:clamp(16px, 2.2vh, 22px);
  letter-spacing:.12em;
  color:var(--ink);
}

/* ---- P10 diverging lines / P11 index line ---- */
.draw path{
  fill:none;
  stroke-width:1.5;
  stroke-linecap:round;
  stroke-dasharray:420;
  stroke-dashoffset:420;
}
.active .draw path{animation:drawpath 2.4s ease .5s forwards}
@keyframes drawpath{to{stroke-dashoffset:0}}
.chart-label{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.08em;
  fill:var(--ink-faint);
}

/* ---- P14 end card ---- */
.qr-card{
  background:#f4f2ec;
  border-radius:10px;
  padding:14px;
  display:inline-flex;
  line-height:0;
}
.qr-card svg{width:240px;height:240px}
.qr-caption{
  font-family:var(--sans);
  font-size:13px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--ink-faint);
}

/* ---- reduced motion: everything instant, loops stop ---- */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation:none !important;
    transition:none !important;
  }
  .fx .kicker,.fx .title,.fx .body,.fx .footnote,.fx .closing,.fx .motif{
    opacity:1;
    transform:none;
  }
  .redact .line i{width:100%}
  .draw path{stroke-dashoffset:0}
  .frame-svg rect.border{stroke-dashoffset:0}
}

/* ---- narrow / portrait adjustments ---- */
@media (max-width:700px), (orientation:portrait){
  .panel .year{font-size:clamp(38px, 8vh, 72px)}
  .panel .body{font-size:clamp(17px, 2.1vh, 21px)}
}
</style>
</head>

  <div id="track"></div>
</div>
<div id="progress">

/* ==================================================================
   Tiny formatter: escape HTML, then *word* becomes <em>word</em>.
=================================================================== */
function fmt(s){
  var out = s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return out;
}

/* ==================================================================
   Build the DOM from PANELS. Pure render, instant on load.
=================================================================== */
var track = document.getElementById("track");
var dotsEl = document.getElementById("dots");
var fillEl = document.getElementById("fill");
var N = PANELS.length;
var idx = 0;

(function render(){
  var i, p, el, html;
  for(i = 0; i < N; i++){
    p = PANELS[i];
    el = document.createElement("section");
    el.className = "panel " + (p.still ? "static-panel" : "fx");
    el.setAttribute("data-era", p.era);
    html = '<div class="year">' + fmt(p.year) + '</div>';
    html += '<div class="content">';
    if(p.kicker){ html += '<div class="kicker">' + fmt(p.kicker) + '</div>'; }
    if(p.motif === "count"){ html += '<div class="motif">' + MOTIFS.count() + '</div>'; }
    html += '<h1 class="title">' + fmt(p.title) + '</h1>';
    html += '<p class="body">' + fmt(p.body) + '</p>';
    if(p.closing){ html += '<div class="closing">' + fmt(p.closing) + '</div>'; }
    if(p.motif && p.motif !== "count"){ html += '<div class="motif">' + MOTIFS[p.motif]() + '</div>'; }
    if(p.footnote){ html += '<div class="footnote">' + fmt(p.footnote) + '</div>'; }
    html += '</div>';
    el.innerHTML = html;
    track.appendChild(el);
  }
  for(i = 0; i < N; i++){
    var b = document.createElement("button");
    b.setAttribute("aria-label", "Panel " + (i + 1));
    b.setAttribute("data-i", i);
    dotsEl.appendChild(b);
  }
})();

var panels = track.children;
var dots = dotsEl.children;

function apply(){
  track.style.transform = "translateX(" + (-idx * 100) + "%)";
  document.body.style.backgroundColor = PANELS[idx].bg;
  for(var i = 0; i < N; i++){
    panels[i].classList.toggle("active", i === idx);
    dots[i].classList.toggle("on", i === idx);
  }
  fillEl.style.width = (idx / (N - 1) * 100) + "%";
}

function goTo(i, rewind){
  i = Math.max(0, Math.min(N - 1, i));
  if(i === idx && !rewind){ apply(); return; }
  idx = i;
  track.classList.toggle("rewind", !!rewind);
  apply();
  if(rewind){
    setTimeout(function(){ track.classList.remove("rewind"); }, 950);
  }
}

/* ==================================================================
   Navigation: swipe (50px / velocity threshold), tap left/right
   thirds, arrow keys, progress dots.

   Touch input is driven by touch events, mouse/pen by pointer
   events. With touch-action:pan-y (needed so too-tall panels can
   scroll vertically on phones) browsers stop delivering pointermove
   once a touch drag exceeds the slop threshold — but touchmove
   keeps firing, so touch swipes must live there.
=================================================================== */
var stage = document.getElementById("stage");
var drag = null;

function startDrag(id, x, y, t){
  drag = { id: id, x0: x, y0: y, t0: t, dx: 0, axis: null };
  track.classList.add("dragging");
  wake();
  poke();
}

function cancelDrag(){
  drag = null;
  track.classList.remove("dragging");
  apply();
}

function moveDrag(id, x, y){
  if(!drag || id !== drag.id){ return; }
  var dx = x - drag.x0;
  var dy = y - drag.y0;
  if(!drag.axis){
    if(Math.abs(dx) < 8 && Math.abs(dy) < 8){ return; }
    /* Lock the gesture to one axis. Vertical means the visitor is
       scrolling a too-tall panel — release it to the browser. */
    if(Math.abs(dy) > Math.abs(dx)){ cancelDrag(); return; }
    drag.axis = "x";
  }
  drag.dx = dx;
  if((idx === 0 && dx > 0) || (idx === N - 1 && dx < 0)){ dx = dx / 3; }
  track.style.transform = "translateX(calc(" + (-idx * 100) + "% + " + dx + "px))";
}

function endDrag(id, x, t){
  if(!drag || id !== drag.id){ return; }
  var dx = drag.dx;
  var dt = Math.max(1, t - drag.t0);
  var v = Math.abs(dx) / dt;
  drag = null;
  track.classList.remove("dragging");
  if(Math.abs(dx) > 50 || (Math.abs(dx) > 18 && v > 0.35)){
    goTo(idx + (dx < 0 ? 1 : -1));
  }else if(Math.abs(dx) < 10 && dt < 500){
    var w = window.innerWidth;
    if(x > w * 2 / 3){ goTo(idx + 1); }
    else if(x < w / 3){ goTo(idx - 1); }
    else { apply(); }
  }else{
    apply();
  }
  poke();
}

/* ---- touch ---- */
stage.addEventListener("touchstart", function(e){
  if(drag){ return; } /* ignore extra fingers in a multi-touch storm */
  var t = e.changedTouches[0];
  startDrag("t" + t.identifier, t.clientX, t.clientY, e.timeStamp);
}, {passive:true});

stage.addEventListener("touchmove", function(e){
  for(var i = 0; i < e.changedTouches.length; i++){
    var t = e.changedTouches[i];
    moveDrag("t" + t.identifier, t.clientX, t.clientY);
  }
}, {passive:true});

function endTouch(e){
  for(var i = 0; i < e.changedTouches.length; i++){
    var t = e.changedTouches[i];
    if(drag && "t" + t.identifier === drag.id){
      if(e.type === "touchcancel"){ cancelDrag(); }
      else { endDrag(drag.id, t.clientX, e.timeStamp); }
    }
  }
}
stage.addEventListener("touchend", endTouch);
stage.addEventListener("touchcancel", endTouch);

/* ---- mouse / pen ---- */
stage.addEventListener("pointerdown", function(e){
  if(drag || e.pointerType === "touch"){ return; }
  startDrag(e.pointerId, e.clientX, e.clientY, e.timeStamp);
}, {passive:true});

stage.addEventListener("pointermove", function(e){
  if(e.pointerType === "touch"){ return; }
  moveDrag(e.pointerId, e.clientX, e.clientY);
}, {passive:true});

stage.addEventListener("pointerup", function(e){
  if(e.pointerType === "touch"){ return; }
  endDrag(e.pointerId, e.clientX, e.timeStamp);
});
stage.addEventListener("pointercancel", function(e){
  if(e.pointerType === "touch"){ return; }
  if(drag && e.pointerId === drag.id){ cancelDrag(); }
});

document.addEventListener("keydown", function(e){
  if(e.key === "ArrowRight" || e.key === " "){ goTo(idx + 1); }
  else if(e.key === "ArrowLeft"){ goTo(idx - 1); }
  else if(e.key === "Home"){ goTo(0); }
  poke();
});

dotsEl.addEventListener("click", function(e){
  var b = e.target.closest("button");
  if(b){ goTo(parseInt(b.getAttribute("data-i"), 10)); }
  poke();
});

/* Block pinch-zoom and double-tap zoom inside Safari. */
document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
document.addEventListener("dblclick", function(e){ e.preventDefault(); });

/* ==================================================================
   Kiosk hardening: 45s idle returns to the attract panel (fast
   rewind through the deck); wake lock held and re-acquired.
=================================================================== */
var IDLE_MS = 45000;
var idleTimer = null;

function poke(){
  if(idleTimer){ clearTimeout(idleTimer); }
  idleTimer = setTimeout(function(){
    if(idx !== 0){ goTo(0, true); }
    poke();
  }, IDLE_MS);
}
poke();

var lock = null;
function wake(){
  if(!("wakeLock" in navigator) || lock){ return; }
  navigator.wakeLock.request("screen").then(function(l){
    lock = l;
    l.addEventListener("release", function(){ lock = null; });
  }).catch(function(){ /* denied or unsupported: Guided Access + Auto-Lock:Never covers it */ });
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible"){ lock = null; wake(); }
});

apply();
