name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      # Backend linkmap suites (node --test). Scoped to the linkmap tests:
      # two older backend suites have pre-existing failures unrelated to
      # deploys, so they don't gate Pages.
      - run: npm ci
        working-directory: portfolio-backend
      - run: node --test test/linkmap-sim.test.js test/linkmap-feed.test.js
        working-directory: portfolio-backend
      # Ketu-9 is a standalone Vite project served at /ketu-9/ alongside the site.
      - run: npm ci
        working-directory: ketu-9
      - run: npm run build
        working-directory: ketu-9
      - run: mkdir -p dist/ketu-9 && cp -r ketu-9/dist/. dist/ketu-9/
      # Meow-9 is a standalone Vite project served at /meow-9/ alongside the site.
      - run: npm ci
        working-directory: meow-9
      - run: npm run build
        working-directory: meow-9
      - run: mkdir -p dist/meow-9 && cp -r meow-9/dist/. dist/meow-9/
      # The Living Link is a standalone Vite project served at /link-map/.
      - run: npm ci
        working-directory: link-map
      - run: npm run build
        working-directory: link-map
      - run: mkdir -p dist/link-map && cp -r link-map/dist/. dist/link-map/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v4
      - id: deploy
        uses: actions/deploy-pages@v4
